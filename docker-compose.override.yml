services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://marketplace_app@db:5432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./src:/app/src
      - ./openapi:/app/openapi
      - ./secrets/db_password:/run/secrets/db_password:ro
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    ports:
      - "25432:5432"
