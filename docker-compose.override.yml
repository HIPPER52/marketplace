services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: marketplace
      DB_USER: marketplace_app
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./src:/app/src
      - ./openapi:/app/openapi
      - ./secrets/db_password:/run/secrets/db_password:ro
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    ports:
      - "5432:5432"
