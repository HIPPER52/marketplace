name: marketplace
services:
  app:
    # Behind a profile so that `docker compose up -d --wait` raises the data layer and the
    # broker and stops there. A fresh clone has no secrets/db_password — it is git-ignored
    # and generated by `npm run setup:secrets` — so starting the service by default would
    # make the one command everything else begins with fail on a bind mount.
    #
    #   docker compose --profile app up -d --wait     the service as well
    profiles: ["app"]
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      # Through the pooler, never straight at Postgres.
      DATABASE_URL: postgres://marketplace_app@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      # The two Redis instances, by service name on the compose network — the published
      # 26379/26380 are for the host, not for a container beside them.
      REDIS_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      # Interpolated from the host environment (compose also reads `.env` for this), and
      # deliberately **not** `${VAR:?message}`: compose interpolates the whole file no
      # matter which profile is active, so a `:?` here would make the bare
      # `docker compose up -d --wait` fail for somebody who is not running the service.
      # Unset, they arrive empty and the application's own schema refuses to start and
      # says which secret is missing — which is the better error anyway.
      JWT_KID: ${JWT_KID}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
    ports:
      - "3000:3000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      # The image writes its own config from env unless one is mounted; ours is mounted.
      DB_HOST: db
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      # Asking the admin console whether it is alive — no psql in this image, so a TCP
      # probe through pg_isready is not available either.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  # Two Redis instances, and the second one is not a luxury.
  #
  # A cache needs `maxmemory` with `allkeys-lru`: without a limit Redis grows until the
  # machine says no, and with the stock `noeviction` policy a full cache does not get
  # slower — it starts **refusing writes** with "OOM command not allowed when used memory >
  # 'maxmemory'". A queue needs the exact opposite: BullMQ's own documentation says it
  # "cannot work properly if Redis evicts keys arbitrarily", so its instance must be
  # `noeviction`.
  #
  # Those two settings cannot coexist in one process. `maxmemory-policy` is per instance,
  # not per database, so `SELECT 1` does not separate them — which is why this is two
  # containers rather than two logical databases.
  redis-cache:
    image: redis:8-alpine
    # Set on the command line rather than in a mounted redis.conf: there are two settings,
    # both load-bearing, and a reader of this file should see them without opening another.
    command:
      ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      # 26379 and 26380, following 25432/26432/25672. Deliberately outside 22300-22399,
      # which is the lecture stand's range — the two must be able to run side by side.
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  # The queue's instance, and where session state lives too. Both have the same
  # requirement — nobody may evict them — and a session thrown out by an LRU is a logout
  # nobody can reproduce.
  redis-queue:
    image: redis:8-alpine
    # AOF with `everysec`: a queue that forgets its jobs on restart is a queue that loses
    # work, and one second of exposure is the usual trade. `maxmemory` is deliberately
    # absent — see the policy below; a limit without eviction is a write that fails.
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    ports:
      - "26380:6379"
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  # RabbitMQ: the broker that keeps an event until somebody is there to take it. #18's
  # WebSocket delivered to whoever happened to be connected — no receiver, no delivery.
  # This one stores the message first and worries about readers afterwards, which is the
  # whole difference between a transport and a broker.
  #
  # 4.2 is the LTS series (commercial support to 30.06.2030) rather than the current 4.3,
  # for the same reason every other version here is pinned: a stand should run what a
  # deployment would run, and two extra years of patches is the entire argument. The
  # -management tag costs a few megabytes and buys the UI on 25673 — which is where
  # x-death gets read with eyes instead of inferred from a script.
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    # RabbitMQ derives its Erlang node name from the hostname, and the node name is what
    # the data directory is named after. Letting Docker generate one means every recreated
    # container looks for a node that never existed and comes up empty.
    hostname: marketplace-rabbit
    environment:
      # The dev stand's credentials, in plain sight on purpose — exactly like the Postgres
      # role in init.sql. `guest` would not do: RabbitMQ refuses it from anything but
      # loopback, and a connection through a published port arrives from the Docker gateway.
      RABBITMQ_DEFAULT_USER: marketplace_app
      RABBITMQ_DEFAULT_PASS: local_dev_password
    ports:
      # Host port 25672 for AMQP (5672 inside), following 25432 and 26432. Worth knowing:
      # 25672 is also RabbitMQ's own Erlang distribution port *inside* the container, and
      # that one is deliberately not published — nothing here clusters.
      - "25672:5672"
      # The management UI. 15672 cannot take the same prefix and stay a port number.
      - "25673:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      # An open TCP port is not a running broker: between the socket accepting connections
      # and the Erlang node accepting basic.publish there is a window a client meets as
      # ECONNRESET. check_running asks the node itself, and that is the difference
      # `up -d --wait` depends on.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # The Pact Broker: where a contract lives once it is no longer only this repository's
  # business. The consumer publishes to it, provider verification reads from it and
  # publishes its result back, and can-i-deploy asks it the one question a deploy gate
  # needs answered — "has anything verified this pair?".
  # The object store: MinIO, which is what the lecture ran and what real S3 is swapped
  # for by changing one variable.
  #
  # The image is **bitnamilegacy/**, and that needs a sentence. `minio/minio` on Docker
  # Hub now answers an anonymous pull with "repository does not exist or may require
  # docker login", and `quay.io/minio/minio` answers 401 — so the upstream image cannot
  # be pulled by a grader on a fresh clone, which is the one thing this file has to
  # guarantee. Bitnami's build is the same MinIO binary (DEVELOPMENT.2025-05-24) and is
  # still public. LocalStack and S3Mock pull freely and were rejected for a different
  # reason: neither enforces access on an anonymous GET, and `demo:cdn` proves a closed
  # bucket by getting 403 from one.
  storage:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      # Dev credentials of a local stand, in this file on purpose and exactly as much a
      # secret as the Postgres password in init.sql — which is to say not one. The real
      # ones never enter git; see README, "Where the credentials come from".
      MINIO_ROOT_USER: marketplace_storage
      MINIO_ROOT_PASSWORD: local_dev_password
    ports:
      # 9000 -> 29000 and 9001 -> 29001, the same prefix rule as 5432 -> 25432 and
      # 9292 -> 29292. The console is published so a human can look; nothing in src/ and
      # nothing in the demos knows that port exists.
      - "29000:9000"
      - "29001:9001"
    volumes:
      - storagedata:/bitnami/minio/data
    healthcheck:
      # The liveness probe MinIO documents, not "does a port answer". `--wait` is only
      # worth writing when the healthcheck means readiness.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20

  pact-broker:
    image: pactfoundation/pact-broker:latest
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@pact-broker-db:5432/pact_broker
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_LOG_LEVEL: WARN
      PACT_BROKER_BASE_URL: http://127.0.0.1:29292
    ports:
      - "29292:9292"
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost can resolve to ::1 and
      # puma listens on IPv4 only, so the probe would never pass.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      pact-broker-db:
        condition: service_healthy

  # The broker keeps its own database rather than a second schema in `db`. Separating them
  # means the restore drill, the migrations and the TRUNCATEs of this project never have
  # an opinion about contract history, and dropping the broker's volume cannot touch the
  # marketplace. Its credentials are deliberately boring: this cluster holds no secrets
  # and exists only so the gate can be demonstrated locally.
  pact-broker-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact_broker
    volumes:
      - pactbrokerdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact_broker"]
      interval: 3s
      timeout: 30s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 3s
      timeout: 30s
      retries: 5

volumes:
  pgdata:
  pactbrokerdata:
  rabbitmqdata:
  redisqueuedata:
  storagedata:
