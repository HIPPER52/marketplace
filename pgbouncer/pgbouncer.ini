;; PgBouncer in front of Postgres.
;;
;; The application never connects to Postgres directly any more: docker-compose.yml points
;; DATABASE_URL at this service, and .env.example points a local run at the published port.
;;
;; Why a pooler at all: a Postgres connection is an operating-system process with its own
;; memory, so "a few hundred clients" is not a number Postgres is happy to hear. The pool
;; inside the application already reuses connections within one process — a pooler does the
;; same thing across every process, pod and CLI script at once, turning many short-lived
;; client connections into a small, stable number of server connections.

[databases]
;; Named exactly like the database, so the client's connection string needs nothing special.
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Plain passwords in userlist.txt, SCRAM on the wire. PgBouncer can derive the SCRAM
;; exchange from a plaintext secret, so one file serves whatever auth_type is configured.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; The whole point of this assignment, and the setting with the sharpest edges.
;;
;; A server connection is held only for the length of a transaction and then handed to
;; whoever is next, which is what lets 200 clients share 10 server connections. The price
;; is that anything which lives in a *session* rather than a transaction stops working:
;;
;;   - session state — SET, LISTEN/NOTIFY, WITH HOLD cursors, temporary tables — because
;;     the next statement may land on a different server connection;
;;   - session-level advisory locks, for the same reason: pg_advisory_lock() would be taken
;;     on one backend and released on another, or never;
;;   - server-side prepared statements, unless PgBouncer tracks them (max_prepared_statements
;;     below, PgBouncer 1.21+).
;;
;; Everything this project does is transaction-scoped: the checkout, the SKIP LOCKED claim
;; and the retry wrapper all open a transaction and finish it. That is what makes
;; transaction mode safe here rather than merely fast.
pool_mode = transaction

;; Small on purpose: the number of server connections is the resource being protected.
default_pool_size = 10
min_pool_size = 0
reserve_pool_size = 5

;; Generous on purpose: client connections are cheap, and `npm run demo:race` opens fifty.
max_client_conn = 200

;; PgBouncer 1.21+ tracks prepared statements per client and replays them onto whichever
;; server connection it hands out. Without this, a driver that names its prepared statements
;; breaks under transaction mode in a way that looks random.
max_prepared_statements = 200

;; libpq sends these at startup; PgBouncer refuses unknown ones unless told to pass them on.
ignore_startup_parameters = extra_float_digits,options

;; The admin console: `psql -p 26432 -U marketplace_app -d pgbouncer -c "SHOW POOLS"`.
;; The application role doubles as the console user because this is a single-tenant local
;; stand. In production these are different roles — the console can PAUSE and KILL.
admin_users = marketplace_app
stats_users = marketplace_app

log_connections = 0
log_disconnections = 0
